name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev

      - name: 📱 Setup Android Capacitor Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Package full YUNAY Studio WebApp Platform into APK
          WWW_DIR="public"
          echo "Packaging full YUNAY Studio Platform into APK: $WWW_DIR"

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.yunay.studio",
            "appName": "YUNAY Studio",
            "webDir": "$WWW_DIR",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

          # Fix duplicate Kotlin stdlib classes
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: 🔨 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          find app/build/outputs/apk -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/yunay-app-debug.apk \;

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunay-android-apk
          path: yunay-app-*.apk

      - name: 🏷️ Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: yunay-app-*.apk
          name: YUNAY Android App Latest Release
          tag_name: latest
          draft: false
          prerelease: false
          generate_release_notes: true