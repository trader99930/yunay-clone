name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev

      - name: 📱 Setup Android Capacitor Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 1. Create public directory
          mkdir -p public

          # 2. Write complete YUNAY Studio WebApp UI
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>YUNAY AI Studio</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { background: #0a0d14; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
              header { background: #111726; border-bottom: 1px solid #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
              .logo { font-size: 17px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
              .badge { background: #10b981; color: #022c22; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; }
              .nav-tabs { display: flex; background: #080c14; border-bottom: 1px solid #1e293b; }
              .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
              .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: #111726; }
              .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
              .tab-content.active { display: flex; }
              .preview-bar { background: #0c101a; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; font-size: 12px; }
              .device-btn { background: #1e293b; border: none; color: #cbd5e1; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
              .device-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }
              .iframe-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; background: #05080e; padding: 8px; overflow: auto; }
              iframe { width: 100%; height: 100%; border: none; background: #fff; border-radius: 8px; }
              .file-bar { background: #0c101a; padding: 8px 12px; display: flex; gap: 8px; border-bottom: 1px solid #1e293b; }
              .file-pill { padding: 4px 12px; background: #1e293b; border-radius: 6px; font-size: 12px; cursor: pointer; color: #94a3b8; }
              .file-pill.active { background: #38bdf8; color: #0f172a; font-weight: 600; }
              textarea { flex: 1; width: 100%; background: #070a10; color: #e2e8f0; font-family: monospace; font-size: 13px; line-height: 1.5; padding: 14px; border: none; outline: none; resize: none; }
              .editor-footer { background: #111726; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1e293b; }
              .scanner-box { padding: 20px; overflow-y: auto; max-width: 600px; margin: 0 auto; width: 100%; }
              .card { background: #111726; border: 1px solid #1e293b; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
              .card h3 { font-size: 16px; margin-bottom: 8px; color: #38bdf8; }
              .card p { font-size: 12px; color: #94a3b8; margin-bottom: 14px; line-height: 1.5; }
              input[type=text] { width: 100%; padding: 12px; background: #080c14; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
              .btn-action { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
              .log-box { margin-top: 14px; background: #05080e; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #10b981; max-height: 180px; overflow-y: auto; display: none; }
            </style>
          </head>
          <body>
            <header>
              <div class="logo">⚡ YUNAY Studio <span class="badge">PRO</span></div>
              <button onclick="exportProjectZip()" style="background:#8b5cf6; border:none; color:#fff; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;">📦 Export</button>
            </header>
            <div class="nav-tabs">
              <button class="tab-btn active" onclick="switchTab('preview', this)">📱 Live Preview</button>
              <button class="tab-btn" onclick="switchTab('editor', this)">💻 Code Editor</button>
              <button class="tab-btn" onclick="switchTab('scanner', this)">🔍 Clone URL</button>
            </div>
            <div id="tab-preview" class="tab-content active">
              <div class="preview-bar">
                <span>Device Simulator:</span>
                <div style="display:flex; gap:6px;">
                  <button class="device-btn active" onclick="setDevice('mobile', this)">Mobile</button>
                  <button class="device-btn" onclick="setDevice('tablet', this)">Tablet</button>
                  <button class="device-btn" onclick="setDevice('desktop', this)">Desktop</button>
                </div>
              </div>
              <div class="iframe-wrapper">
                <iframe id="previewFrame" style="max-width:390px; height:680px;"></iframe>
              </div>
            </div>
            <div id="tab-editor" class="tab-content">
              <div class="file-bar">
                <div class="file-pill active" onclick="switchFile('index.html', this)">🌐 index.html</div>
                <div class="file-pill" onclick="switchFile('styles.css', this)">🎨 styles.css</div>
                <div class="file-pill" onclick="switchFile('app.js', this)">📜 app.js</div>
              </div>
              <textarea id="codeEditor" spellcheck="false"></textarea>
              <div class="editor-footer">
                <span id="editorStatus" style="font-size:11px; color:#94a3b8;">Saved</span>
                <button onclick="saveCurrentFile()" style="background:#10b981; border:none; color:#022c22; padding:6px 14px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;">💾 Save & Update</button>
              </div>
            </div>
            <div id="tab-scanner" class="tab-content">
              <div class="scanner-box">
                <div class="card">
                  <h3>🌐 Reverse Engineer & Clone WebApp</h3>
                  <p>Enter any URL to clone layout, detect frameworks, and reconstruct source code.</p>
                  <input type="text" id="targetUrl" placeholder="https://example.com" value="https://react.dev">
                  <button class="btn-action" id="btnClone" onclick="cloneWebsite()">⚡ Start Reverse Engineering</button>
                  <div id="scanLog" class="log-box"></div>
                </div>
              </div>
            </div>
            <script>
              var files = {
                "index.html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><link rel=\"stylesheet\" href=\"styles.css\"></head><body><div class=\"app-card\"><div class=\"chip\">YUNAY RECONSTRUCTED</div><h2>Trading Studio Pro</h2><p>Live Real-Time Market Simulator</p><div class=\"metric\"><span>BTC/USDT</span><span id=\"priceDisplay\" style=\"color:#34d399;font-weight:bold;\">$94,320.50</span></div><button class=\"btn-action\" onclick=\"simulateTrade()\">Simulate Live Signal</button><div id=\"tradeLog\" style=\"margin-top:12px;color:#10b981;font-family:monospace;font-size:12px;\">System initialized and connected.</div></div><script src=\"app.js\"><" + "/script></body></html>",
                "styles.css": "body { margin:0; padding:16px; background:#0b0f19; color:#f8fafc; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:90vh; } .app-card { background:#131c2e; border:1px solid #1e293b; border-radius:16px; padding:24px; width:100%; max-width:420px; box-shadow:0 12px 36px rgba(0,0,0,0.6); } .chip { display:inline-block; background:#10b981; color:#022c22; font-size:10px; font-weight:800; padding:4px 10px; border-radius:12px; margin-bottom:12px; } h2 { margin:0 0 4px; font-size:24px; color:#38bdf8; } p { color:#94a3b8; font-size:13px; margin-bottom:20px; } .metric { background:#0a0d14; border:1px solid #1e293b; border-radius:10px; padding:14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; } .btn-action { width:100%; background:#2563eb; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; }",
                "app.js": "function simulateTrade() { var p = (94000 + Math.random() * 800).toFixed(2); document.getElementById('priceDisplay').textContent = '$' + p; document.getElementById('tradeLog').textContent = '[YUNAY Signal] Executed at ' + new Date().toLocaleTimeString(); }"
              };
              var activeFile = "index.html";
              var editor = document.getElementById("codeEditor");
              function renderPreview() {
                var h = files["index.html"] || "";
                var c = files["styles.css"] || "";
                var j = files["app.js"] || "";
                var doc = h.replace(/<link rel="stylesheet"[^>]*>/i, "<style>" + c + "</style>").replace(/<script src="app.js"><\/script>/i, "<script>" + j + "<\/script>");
                document.getElementById("previewFrame").srcdoc = doc;
              }
              function switchTab(name, btn) {
                document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
                document.querySelectorAll(".tab-content").forEach(function(c){ c.classList.remove("active"); });
                btn.classList.add("active");
                document.getElementById("tab-" + name).classList.add("active");
                if (name === "preview") renderPreview();
              }
              function setDevice(type, btn) {
                document.querySelectorAll(".device-btn").forEach(function(b){ b.classList.remove("active"); });
                btn.classList.add("active");
                var f = document.getElementById("previewFrame");
                if (type === "mobile") { f.style.maxWidth = "390px"; f.style.height = "680px"; }
                else if (type === "tablet") { f.style.maxWidth = "768px"; f.style.height = "700px"; }
                else { f.style.maxWidth = "100%"; f.style.height = "100%"; }
              }
              function switchFile(fileName, pill) {
                files[activeFile] = editor.value;
                activeFile = fileName;
                document.querySelectorAll(".file-pill").forEach(function(p){ p.classList.remove("active"); });
                pill.classList.add("active");
                editor.value = files[fileName];
                document.getElementById("editorStatus").textContent = "Editing " + fileName;
              }
              function saveCurrentFile() {
                files[activeFile] = editor.value;
                renderPreview();
                document.getElementById("editorStatus").textContent = "Saved at " + new Date().toLocaleTimeString();
                alert("✅ Saved! Live Preview updated.");
              }
              function exportProjectZip() {
                var b = new Blob([files["index.html"]], { type: "text/html" });
                var a = document.createElement("a");
                a.href = URL.createObjectURL(b);
                a.download = "yunay-project.html";
                a.click();
              }
              function cloneWebsite() {
                var url = document.getElementById("targetUrl").value.trim();
                var log = document.getElementById("scanLog");
                var btn = document.getElementById("btnClone");
                log.style.display = "block";
                btn.disabled = true;
                btn.textContent = "Cloning & Reconstructing...";
                log.innerHTML = "> Scanning " + url + "...<br>> Detecting frameworks...<br>> Extracting layout...";
                setTimeout(function() {
                  var domain = url.replace(/https?:\/\//, "").split("/")[0];
                  files["index.html"] = "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><link rel=\"stylesheet\" href=\"styles.css\"></head><body><div class=\"app-card\"><div class=\"chip\">CLONED & RECONSTRUCTED</div><h2>" + domain + "</h2><p>Cloned with YUNAY Reverse Engineering Engine</p><button class=\"btn-action\" onclick=\"alert('Cloned interaction working!')\">Test Cloned Component</button></div></body></html>";
                  log.innerHTML += "<br>> <span style=\"color:#34d399;\">✅ Reconstruction Complete!</span>";
                  btn.disabled = false;
                  btn.textContent = "⚡ Start Reverse Engineering";
                  switchTab("preview", document.querySelectorAll(".tab-btn")[0]);
                }, 1500);
              }
              editor.value = files[activeFile];
              renderPreview();
            </script>
          </body>
          </html>
          EOF

          # 3. Create capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yunay.studio",
            "appName": "YUNAY Studio",
            "webDir": "public",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          # 4. Add Android platform and copy web assets
          npx cap add android
          npx cap sync android

          # 5. Enable cleartext traffic
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true

          # 6. Fix duplicate Kotlin stdlib classes
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: 🔨 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          find app/build/outputs/apk -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/yunay-app-debug.apk \;

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunay-android-apk
          path: yunay-app-*.apk

      - name: 🏷️ Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: yunay-app-*.apk
          name: YUNAY Android App Latest Release
          tag_name: latest
          draft: false
          prerelease: false
          generate_release_notes: true