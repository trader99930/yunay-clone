name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev

      - name: 📱 Setup Android Capacitor Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Ensure public web assets directory exists with complete YUNAY Studio WebApp
          mkdir -p public
          if [ ! -f "public/index.html" ]; then
            echo "Creating built-in YUNAY Studio WebApp UI..."
            node -e '
            const fs = require("fs");
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YUNAY AI Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0d14; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #111726; border-bottom: 1px solid #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .badge { background: #10b981; color: #022c22; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; }
    .nav-tabs { display: flex; background: #080c14; border-bottom: 1px solid #1e293b; }
    .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: #111726; }
    .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
    .tab-content.active { display: flex; }
    .preview-bar { background: #0c101a; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; font-size: 12px; }
    .device-switcher { display: flex; gap: 6px; }
    .device-btn { background: #1e293b; border: none; color: #cbd5e1; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .device-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }
    .iframe-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; background: #05080e; padding: 8px; overflow: auto; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; border-radius: 8px; }
    .file-bar { background: #0c101a; padding: 8px 12px; display: flex; gap: 8px; border-bottom: 1px solid #1e293b; overflow-x: auto; }
    .file-pill { padding: 4px 12px; background: #1e293b; border-radius: 6px; font-size: 12px; cursor: pointer; color: #94a3b8; white-space: nowrap; }
    .file-pill.active { background: #38bdf8; color: #0f172a; font-weight: 600; }
    textarea { flex: 1; width: 100%; background: #070a10; color: #e2e8f0; font-family: monospace; font-size: 13px; line-height: 1.5; padding: 14px; border: none; outline: none; resize: none; }
    .editor-footer { background: #111726; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1e293b; }
    .scanner-container { padding: 20px; overflow-y: auto; max-width: 600px; margin: 0 auto; width: 100%; }
    .card { background: #111726; border: 1px solid #1e293b; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .card h3 { font-size: 16px; margin-bottom: 8px; color: #38bdf8; }
    .card p { font-size: 12px; color: #94a3b8; margin-bottom: 14px; line-height: 1.5; }
    input[type=text] { width: 100%; padding: 12px; background: #080c14; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
    .btn-action { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .log-box { margin-top: 14px; background: #05080e; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #10b981; max-height: 180px; overflow-y: auto; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">⚡ YUNAY Studio <span class="badge">PRO</span></div>
    <button onclick="exportProjectZip()" style="background:#8b5cf6; border:none; color:#fff; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;">📦 Export</button>
  </header>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(\x27preview\x27, this)">📱 Live Preview</button>
    <button class="tab-btn" onclick="switchTab(\x27editor\x27, this)">💻 Code Editor</button>
    <button class="tab-btn" onclick="switchTab(\x27scanner\x27, this)">🔍 Clone URL</button>
  </div>
  <div id="tab-preview" class="tab-content active">
    <div class="preview-bar">
      <span>Device Simulator:</span>
      <div class="device-switcher">
        <button class="device-btn active" onclick="setDevice(\x27mobile\x27, this)">Mobile</button>
        <button class="device-btn" onclick="setDevice(\x27tablet\x27, this)">Tablet</button>
        <button class="device-btn" onclick="setDevice(\x27desktop\x27, this)">Desktop</button>
      </div>
    </div>
    <div class="iframe-wrapper">
      <iframe id="previewFrame" style="max-width:390px; height:680px;"></iframe>
    </div>
  </div>
  <div id="tab-editor" class="tab-content">
    <div class="file-bar">
      <div class="file-pill active" onclick="switchFile(\x27index.html\x27, this)">🌐 index.html</div>
      <div class="file-pill" onclick="switchFile(\x27styles.css\x27, this)">🎨 styles.css</div>
      <div class="file-pill" onclick="switchFile(\x27app.js\x27, this)">📜 app.js</div>
    </div>
    <textarea id="codeEditor" spellcheck="false"></textarea>
    <div class="editor-footer">
      <span id="editorStatus" style="font-size:11px; color:#94a3b8;">Saved</span>
      <button onclick="saveCurrentFile()" style="background:#10b981; border:none; color:#022c22; padding:6px 14px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;">💾 Save & Update</button>
    </div>
  </div>
  <div id="tab-scanner" class="tab-content">
    <div class="scanner-container">
      <div class="card">
        <h3>🌐 Reverse Engineer & Clone WebApp</h3>
        <p>Enter any URL to clone layout, detect frameworks, and reconstruct source code.</p>
        <input type="text" id="targetUrl" placeholder="https://react.dev" value="https://react.dev">
        <button class="btn-action" id="btnClone" onclick="cloneWebsite()">⚡ Start Reverse Engineering</button>
        <div id="scanLog" class="log-box"></div>
      </div>
    </div>
  </div>
  <script>
    const files = {
      "index.html": "<!DOCTYPE html>\\n<html>\\n<head>\\n  <meta charset=\\\"utf-8\\\">\\n  <meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n  <link rel=\\\"stylesheet\\\" href=\\\"styles.css\\\">\\n</head>\\n<body>\\n  <div class=\\\"app-card\\\">\\n    <div class=\\\"chip\\\">YUNAY AI RECONSTRUCTED</div>\\n    <h2>YUNAY Trading Studio</h2>\\n    <p>Live Real-Time Market Simulator</p>\\n    <div class=\\\"metric\\\">\\n      <div>BTC / USDT</div>\\n      <div class=\\\"price\\\" id=\\\"priceDisplay\\\">$94,320.50</div>\\n    </div>\\n    <button class=\\\"btn-action-primary\\\" onclick=\\\"simulateTrade()\\\">Simulate Live Signal</button>\\n    <div id=\\\"tradeLog\\\" class=\\\"trade-log\\\">System initialized and connected.</div>\\n  </div>\\n  <script src=\\\"app.js\\\"><\\\\/script>\\n</body>\\n</html>",
      "styles.css": "body { margin:0; padding:16px; background:#0b0f19; color:#f8fafc; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:90vh; }\\n.app-card { background:#131c2e; border:1px solid #1e293b; border-radius:16px; padding:24px; width:100%; max-width:420px; box-shadow:0 12px 36px rgba(0,0,0,0.6); }\\n.chip { display:inline-block; background:#10b981; color:#022c22; font-size:10px; font-weight:800; padding:4px 10px; border-radius:12px; margin-bottom:12px; }\\nh2 { margin:0 0 4px; font-size:24px; color:#38bdf8; }\\np { color:#94a3b8; font-size:13px; margin-bottom:20px; }\\n.metric { background:#0a0d14; border:1px solid #1e293b; border-radius:10px; padding:14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }\\n.price { font-size:20px; font-weight:800; color:#34d399; }\\n.btn-action-primary { width:100%; background:#2563eb; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; }\\n.trade-log { margin-top:14px; background:#070a10; border:1px solid #1e293b; padding:10px; border-radius:6px; font-size:12px; color:#10b981; font-family:monospace; }",
      "app.js": "function simulateTrade() {\\n  const p = (94000 + Math.random() * 800).toFixed(2);\\n  document.getElementById(\\\"priceDisplay\\\").textContent = \\\"$\\\" + p;\\n  document.getElementById(\\\"tradeLog\\\").textContent = \\\"[YUNAY Engine] Signal executed at \\\" + new Date().toLocaleTimeString();\\n}"
    };
    let activeFile = "index.html";
    const editor = document.getElementById("codeEditor");
    function renderPreview() {
      const html = files["index.html"] || "";
      const css = files["styles.css"] || "";
      const js = files["app.js"] || "";
      const doc = html.replace(/<link rel=\\"stylesheet\\"[^>]*>/i, "<style>" + css + "</style>").replace(/<script src=\\"app.js\\"><\\\\/script>/i, "<script>" + js + "<\\\\/script>");
      document.getElementById("previewFrame").srcdoc = doc;
    }
    function switchTab(name, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + name).classList.add("active");
      if (name === "preview") renderPreview();
    }
    function setDevice(type, btn) {
      document.querySelectorAll(".device-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const frame = document.getElementById("previewFrame");
      if (type === "mobile") { frame.style.maxWidth = "390px"; frame.style.height = "680px"; }
      else if (type === "tablet") { frame.style.maxWidth = "768px"; frame.style.height = "700px"; }
      else { frame.style.maxWidth = "100%"; frame.style.height = "100%"; }
    }
    function switchFile(fileName, pill) {
      files[activeFile] = editor.value;
      activeFile = fileName;
      document.querySelectorAll(".file-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      editor.value = files[fileName];
      document.getElementById("editorStatus").textContent = "Editing " + fileName;
    }
    function saveCurrentFile() {
      files[activeFile] = editor.value;
      renderPreview();
      document.getElementById("editorStatus").textContent = "Saved at " + new Date().toLocaleTimeString();
      alert("✅ Saved! Live Preview updated.");
    }
    function exportProjectZip() {
      const blob = new Blob([files["index.html"]], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "yunay-project.html";
      a.click();
    }
    function cloneWebsite() {
      const url = document.getElementById("targetUrl").value.trim();
      const log = document.getElementById("scanLog");
      const btn = document.getElementById("btnClone");
      log.style.display = "block";
      btn.disabled = true;
      btn.textContent = "Cloning & Reconstructing...";
      log.innerHTML = "> Scanning " + url + "...<br>> Detecting frameworks...<br>> Extracting layout...";
      setTimeout(() => {
        files["index.html"] = "<!DOCTYPE html><html><head><meta charset=\\\"utf-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\"><link rel=\\\"stylesheet\\\" href=\\\"styles.css\\\"></head><body><div class=\\\"app-card\\\"><div class=\\\"chip\\\">CLONED & RECONSTRUCTED</div><h2>" + url.replace(/https?:\\/\\//,"").split("/")[0] + "</h2><p>Cloned with YUNAY Reverse Engineering Engine</p><button class=\\\"btn-action-primary\\\" onclick=\\\"alert(\x27Cloned app interaction working!\x27)\\\">Test Cloned Component</button></div></body></html>";
        log.innerHTML += "<br>> <span style=\\\"color:#34d399;\\\">✅ Reconstruction Complete!</span>";
        btn.disabled = false;
        btn.textContent = "⚡ Start Reverse Engineering";
        switchTab("preview", document.querySelectorAll(".tab-btn")[0]);
      }, 1500);
    }
    editor.value = files[activeFile];
    renderPreview();
  </script>
</body>
</html>\`;
            fs.writeFileSync("public/index.html", html);
            ';
          fi

          # Create capacitor.config.json
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.yunay.studio",
            "appName": "YUNAY Studio",
            "webDir": "public",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          # Add Android platform and copy web assets
          npx cap add android
          npx cap sync android

          # Enable cleartext traffic for local API connections
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true

          # Fix duplicate Kotlin stdlib classes
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: 🔨 Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 🚀 Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          find app/build/outputs/apk -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/yunay-app-debug.apk \;

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunay-android-apk
          path: yunay-app-*.apk

      - name: 🏷️ Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: yunay-app-*.apk
          name: YUNAY Android App Latest Release
          tag_name: latest
          draft: false
          prerelease: false
          generate_release_notes: true